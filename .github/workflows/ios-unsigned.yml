name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tooling
        run: |
          brew install xcodegen cocoapods || true
          cargo install tauri-cli --version "^2" --locked

      - name: Generate icons
        run: cargo tauri icon app-icon.png

      - name: Generate Xcode project
        run: cargo tauri ios init --ci

      - name: Build Rust library for iOS
        working-directory: src-tauri
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo build --release --lib --target aarch64-apple-ios --features tauri/custom-protocol
          mkdir -p gen/apple/Externals/arm64/release
          cp target/aarch64-apple-ios/release/libferrum_lib.a gen/apple/Externals/arm64/release/libapp.a

      - name: Build app (no code signing)
        working-directory: src-tauri/gen/apple
        run: |
          PROJ=$(ls -d *.xcodeproj | head -n1)
          python3 - "$PROJ/project.pbxproj" <<'PY'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s, n = re.subn(r'shellScript = "(?:[^"\\]|\\.)*tauri(?:[^"\\]|\\.)*";', 'shellScript = "exit 0";', s)
          open(p, "w").write(s)
          print("patched script phases:", n)
          PY
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json; print([s for s in json.load(sys.stdin)['project']['schemes'] if s.endswith('_iOS')][0])")
          set +e
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          echo "xcodebuild exit status: $STATUS"
          grep -nE "error:|ld: " xcodebuild.log | head -40
          exit $STATUS


      - name: Package IPA
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name "*.app" -path "*iphoneos*" | head -n1)
          echo "Found app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Ferrum-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ferrum-unsigned-ipa
          path: out/Ferrum-unsigned.ipa
