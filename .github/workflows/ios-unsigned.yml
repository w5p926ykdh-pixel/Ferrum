name: iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tooling
        run: |
          brew install xcodegen cocoapods || true
          cargo install tauri-cli --version "^2" --locked

      - name: Generate icons
        run: cargo tauri icon app-icon.png

      - name: Generate Xcode project
        run: cargo tauri ios init --ci

      - name: Build (no code signing)
        working-directory: src-tauri/gen/apple
        run: |
          PROJ=$(ls -d *.xcodeproj | head -n1)
          SCHEME=$(xcodebuild -list -project "$PROJ" -json | python3 -c "import sys,json; print([s for s in json.load(sys.stdin)['project']['schemes'] if s.endswith('_iOS')][0])")
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Package IPA
        run: |
          APP=$(find src-tauri/gen/apple/build -type d -name "*.app" -path "*iphoneos*" | head -n1)
          echo "Found app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry Ferrum-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: Ferrum-unsigned-ipa
          path: out/Ferrum-unsigned.ipa
